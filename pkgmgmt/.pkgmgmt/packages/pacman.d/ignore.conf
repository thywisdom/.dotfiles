# pacman IgnorePkg configuration — managed from dotfiles
# This file is included by /etc/pacman.conf via:
#   Include = /etc/pacman.d/dotfiles-ignore.conf  →  (symlink)  →  this file
#
# Add packages below that should be excluded from automatic upgrades.
# One directive per line. Multiple IgnorePkg lines are additive (they accumulate).
# Shell-style glob patterns are supported.
#
# Example:
#   IgnorePkg = linux
#   IgnorePkg = linux-headers
#   IgnorePkg = hyprland quickshell
#
# Other supported directives (add as needed):
#   NoUpgrade = etc/somefile         # keep existing file; new version saved as .pacnew
#   NoExtract = usr/share/doc/*      # never extract these paths from any package

IgnorePkg = spotify
IgnorePkg = onlyoffice-bin
IgnorePkg = discord
IgnorePkg = obsidian
IgnorePkg = vscodium-bin
IgnorePkg = chromium
IgnorePkg = brave-origin-bin
IgnorePkg = telegram-desktop
