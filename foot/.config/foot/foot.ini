[main]
include              = ~/.config/omarchy/current/theme/foot.ini
term                 = xterm-256color
font                 = JetBrainsMono Nerd Font:size=9
pad                  = 14x14
initial-window-mode  = windowed
workers              = 0

[scrollback]
lines = 10000

[cursor]
style = block
blink = no

[key-bindings]
clipboard-copy  = Control+Insert Control+c
clipboard-paste = Shift+Insert Control+v
primary-paste   = none

[text-bindings]
