include ~/.config/omarchy/current/theme/kitty.conf

# Font
font_family          JetBrainsMono Nerd Font
bold_italic_font     auto
font_size            9.0

# Window
window_padding_width         14
window_padding_height        14
hide_window_decorations      yes
show_window_resize_notification no
confirm_os_window_close      0

# Remote access
single_instance    yes
allow_remote_control yes

# Aesthetics
cursor_shape    block
enable_audio_bell no

# Tab bar
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# ============================================
# Keybindings
# ============================================

map f11            toggle_fullscreen
map ctrl+insert    copy_to_clipboard
map shift+insert   paste_from_clipboard
map ctrl+v         paste_from_clipboard
map ctrl+c         copy_to_clipboard

# Send literal Ctrl+C (ETX) with Ctrl+Shift+C
map ctrl+shift+c   send_text all \x03

# CSI-u sequences so TUIs / tmux can distinguish these combos
map shift+enter     send_text all \e[13;2u
map alt+shift+enter send_text all \e[13;4u
