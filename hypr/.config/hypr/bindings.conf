# ============================================
# HYPRLAND KEYBINDINGS
# ============================================
# Binding Hierarchy:

#   SUPER + Key            = Primary action
#   SUPER SHIFT + Key      = Alternative (same category)
#   SUPER CTRL + Key      = Variant / incognito / special

# ============================================
# Reserved Keys (Omarchy Defaults):
#   SUPER + C/V/X          = Copy / Paste / Cut
#   SUPER + G              = Group tabs toggle
#   SUPER + T              = Toggle floaet mode
#   SUPER + S              = Special workspace
# ============================================

# Application Variables
$terminal   = uwsm app -- $(omarchy-default-terminal)
$browser    = omarchy-launch-browser
$editor     = uwsm app -- $(omarchy-default-editor)



# ╔══════════════════════════════════════════╗
# ║         SESSION 1 — SYSTEM CONTROLS     ║
# ╚══════════════════════════════════════════╝

# ============================================
# UNBINDINGS
# ============================================
unbind = SUPER, W
unbind = SUPER, G
unbind = SUPER, P
unbind = SUPER, O
unbind = SUPER, slash
unbind = SUPER, code:61
unbind = SUPER ALT, code:61
unbind = SUPER, L

# ============================================
# WINDOW MANAGEMENT
# ============================================
bind  = SUPER SHIFT, Q,           Killactive,

# ============================================
# INTERFACE & BARS & CUSTOM SWITCHERS
# ============================================

bindd = CTRL SHIFT, O,            Projects,           exec, /home/suman/.config/hypr/scripts/project-open.sh
bindd = CTRL SHIFT, N,            Obsidian sync,      exec, /home/suman/.config/hypr/scripts/obsync.sh
bindd = CTRL SHIFT, Space,            Scripts Menu,       exec, /home/suman/.config/hypr/scripts/unified_menu.sh

# ============================================
# UTILITIES
# ============================================


# ╔══════════════════════════════════════════╗
# ║         NUMERIC BINDINGS                ║
# ╚══════════════════════════════════════════╝
# (Add numeric keys here)

# ╔══════════════════════════════════════════╗
# ║     SPECIAL CHARACTER BINDINGS          ║
# ╚══════════════════════════════════════════╝

#Teminal
bindd = SUPER, Return,        Terminal,          exec, $terminal --working-directory $(omarchy-cmd-terminal-cwd)
bindd = SUPER ALT, RETURN,    Tmux,              exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new

# Editors
bindd = SUPER, COMMA,         Editor (Default),   exec, $editor
bindd = SUPER SHIFT, COMMA,         Editor (Antigravity),   exec, uwsm app -- antigravity-launch

# Music
bindd = SUPER, PERIOD,        Spotify,           exec, uwsm app -- spotify changes
bindd = SUPER SHIFT, PERIOD,  YouTube Music,     exec, omarchy-launch-webapp "https://music.youtube.com/"

# Search
bindd = SUPER, Slash,         Google Search,     exec, omarchy-launch-webapp "https://google.com/"

# ╔══════════════════════════════════════════╗
# ║         ALPHABETICAL BINDINGS           ║
# ╚══════════════════════════════════════════╝

# --- A ---
bindd = SUPER,       A, AI (ChatGPT),            exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, AI (Grok),               exec, omarchy-launch-webapp "https://grok.com/"
bindd = SUPER ALT,   A, AI (Claude),             exec, omarchy-launch-webapp "https://claude.ai/new"

# --- B ---
bindd = SUPER,       B, Browser (Default),       exec, $browser
bindd = SUPER SHIFT, B, Browser (Private),       exec, $browser --incognito

# --- D ---
bindd = SUPER,       D, Discord,                 exec, uwsm app -- discord
bindd = SUPER SHIFT, D, Docker (Lazydocker),     exec, $terminal -e lazydocker

# --- E ---
bindd = SUPER,       E, File Manager (Nautilus), exec, uwsm app -- nautilus --new-window

# --- G ---
bindd = SUPER,       G, GitHub,                  exec, omarchy-launch-webapp "https://github.com/"

# --- L ---
bindd = SUPER,       L, LeetCode,                exec, omarchy-launch-webapp "https://leetcode.com/problemset/"

# --- M ---
bindd = SUPER,       M, Email (Primary),         exec, omarchy-launch-webapp "https://mail.google.com/mail/u/0/"
bindd = SUPER SHIFT, M, Email (Personal),        exec, omarchy-launch-webapp "https://mail.google.com/mail/u/1/"

# --- N ---
#bindd = SUPER, N, Notes (Typora),          exec, omarchy-launch-or-focus typora "uwsm app -- typora --disable-gpu --enable-wayland-ime"
bindd = SUPER, N, Notes (Obsidian),        exec, omarchy-launch-or-focus obsidian "uwsm app -- zennotes  --enable-wayland-ime"
bindd = SUPER SHIFT, N, Notes (Google Keep),    exec, omarchy-launch-webapp "https://keep.google.com/u/0/"

# --- R ---
bindd = SUPER,       R, Reddit,                  exec, omarchy-launch-webapp "https://reddit.com"

# --- W ---
bindd = SUPER SHIFT, W, WhatsApp,                exec, omarchy-launch-webapp "https://web.whatsapp.com/"

# --- Y ---
bindd = SUPER,       Y, YouTube,                 exec, omarchy-launch-webapp "https://youtube.com/"
