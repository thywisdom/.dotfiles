# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# Note: You must relaunch Hyprland after changing monitors (use Super+Esc, then Relaunch)

# -----------------------------------------
# Retina-class 2x displays (13" 2.8K, 27" 5K, 32" 6K)
# -----------------------------------------
# env = GDK_SCALE,2
# monitor=,preferred,auto,auto

# -----------------------------------------
# Laptop (eDP-1) + external HDMI — 1080p @ 1.25x
# -----------------------------------------
env     = GDK_SCALE,1
monitor = eDP-1,    1920x1080@60,  auto,   1.25
monitor = HDMI-A-1, 1920x1080@60,  1920x0, 1.25
# mirror mode: monitor = HDMI-A-1, 1920x1080@60, 0x0, 1.25, mirror, eDP-1

# -----------------------------------------
# Low-resolution displays (1080p / 1440p)
# -----------------------------------------
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# -----------------------------------------
# Framework 13 w/ 6K XDR Apple display
# -----------------------------------------
# monitor = DP-5,  6016x3384@60,  auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2

# -----------------------------------------
# Workspace assignment
# -----------------------------------------
workspace = 5, monitor:eDP-1, default:true
