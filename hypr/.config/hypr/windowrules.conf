# ============================================
# HYPRLAND WINDOW RULES
# Matches are strictly Regex and must fully match.
# See https://wiki.hypr.land/Configuring/Window-Rules/
#
# Tip: hyprctl clients | grep -i <classname>   → find class/title for a window
# ============================================


# ============================================
# WORKSPACE ASSIGNMENTS (commented — pin apps to workspaces)
# ============================================

# WhatsApp → workspace 3
# windowrule = workspace 3, match:title ^(WhatsApp)$
# windowrule = workspace 3, match:class .*whatsapp.*

# Discord → workspace 4
# windowrule = workspace 4, match:class ^(vesktop|discord)$
# windowrule = workspace 4, match:title ^(Discord)$

# Spotify & Music → special:music scratchpad (silent = no auto-focus-switch)
windowrule = workspace special:music silent, match:class ^(Spotify|spotify)$
windowrule = workspace special:music silent, match:class ^(brave-music\.youtube\.com__-Default)$
windowrule = workspace special:music silent, match:title ^(Spotify Premium|YouTube Music)$


# ============================================
# FLOATING WINDOWS
# ============================================

# Custom floating class (any window launched with class "floating")
windowrule = float 1, size 60% 50%, center 1, match:class ^(floating)$

# User scripts launched in terminal (bin-permissions etc.) — float centered
windowrule = float 1, size 80% 60%, center 1, match:class ^(user-script)$

# Google search & Gemini search webapps
windowrule = float 1,       match:class ^(brave-google\.com__-Default|brave-gemini\.google\.com__app-Default)$
windowrule = size 1100 700, match:class ^(brave-google\.com__-Default|brave-gemini\.google\.com__app-Default)$
windowrule = center 1,      match:class ^(brave-google\.com__-Default|brave-gemini\.google\.com__app-Default)$

# System dialogs (file pickers, portals, OnlyOffice popups)
windowrule = float 1,      match:class ^(DesktopEditors|xdg-desktop-portal-gtk|Xdg-desktop-portal-gtk)$
windowrule = size 60% 50%, match:class ^(DesktopEditors|xdg-desktop-portal-gtk|Xdg-desktop-portal-gtk)$
windowrule = center 1,     match:class ^(DesktopEditors|xdg-desktop-portal-gtk|Xdg-desktop-portal-gtk)$


# ============================================
# TRANSPARENCY (global — disabled by default)
# ============================================
