general {
  lock_cmd         = omarchy-system-lock                               # lock screen (+ 1password)
  before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock        # lock before suspend (no display-off scheduling)
  after_sleep_cmd  = sleep 1 && omarchy-system-wake                   # delay for PAM readiness, then wake display
  inhibit_sleep    = 3                                                 # wait until screen is locked before suspending
}

# Screensaver after 2.5 minutes of idle
listener {
  timeout    = 150
  on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock system after 30 minutes of idle
# (screensaver resets the idle timer, so 1800s is used instead of 302s)
listener {
  timeout    = 1800
  on-timeout = omarchy-system-lock
  on-resume  = omarchy-system-wake
}
