# hyprsunset — colour temperature manager
# Without a profile, hyprsunset applies no tint by default.
# Use nightlight.sh (SUPER+F in bindings) to toggle warm/cool manually.

# Uncomment to set a fixed temperature override:
# max-gamma = 150

# Uncomment to schedule automatic colour temperature changes:
# profile {
#   time        = 00:00
#   identity    = false
#   temperature = 3300
#   gamma       = 0.8
# }
