# Extra env variables
# Note: You must relaunch Hyprland after changing envs (use Super+Esc, then Relaunch)
# env = MY_GLOBAL_ENV,setting

env = PATH,$PATH:/home/suman/.local/bin

# ==========================
# Session / Desktop Identity
# ==========================

env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

# =========
# Cursor
# =========

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# =========
# GTK
# =========

env = GDK_BACKEND,wayland,x11,*

# =========
# Qt
# =========

env = QT_QPA_PLATFORM,wayland;xcb
env = QT_STYLE_OVERRIDE,kvantum

# Optional — if you use qt6ct / qt5ct
# env = QT_QPA_PLATFORMTHEME,qt6ct

# ===================
# Firefox / Mozilla
# ===================

env = MOZ_ENABLE_WAYLAND,1

# ==========================
# Chromium / Electron
# ==========================

env = OZONE_PLATFORM,auto
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# =================
# Compose Key
# =================

env = XCOMPOSEFILE,$HOME/.XCompose

# =========
# NVIDIA
# =========
# Turing+ with GSP firmware (uncomment if on NVIDIA)

env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# Tensaku screenshot editor (set by `tensaku --wire-omarchy`).
env = OMARCHY_SCREENSHOT_EDITOR,/usr/bin/tensaku-edit
